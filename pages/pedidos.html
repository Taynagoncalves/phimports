<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../img/favicon.png">
  <link rel="manifest" href="app.webmanifest">
  <link rel="apple-touch-icon" href="../img/app-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PH Imports">
  <meta name="theme-color" content="#18181B">
  <title>Pedidos online</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Tema claro/escuro antes de desenhar a página (evita piscar) -->
  <script>try{var t=localStorage.getItem("gestaoloja:tema");document.documentElement.dataset.tema=t||(matchMedia("(prefers-color-scheme: dark)").matches?"escuro":"claro");}catch(e){}try{if(localStorage.getItem("gestaoloja:menu")==="recolhido")document.documentElement.classList.add("menu-recolhido");}catch(e){}try{var c=localStorage.getItem("gestaoloja:corcss");if(c){var s=document.createElement("style");s.id="cor-marca";s.textContent=c;document.head.appendChild(s);}}catch(e){}</script>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">
</head>
<body data-pagina="pedidos" data-titulo="Pedidos online">
  <a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>

      <main class="conteudo" id="conteudo" tabindex="-1">
        <div class="pagina-cabecalho">
          <div>
            <h1>Pedidos online</h1>
            <p>Pedidos feitos no catálogo. As peças ficam reservadas até o pedido virar venda ou ser cancelado.</p>
          </div>
          <div class="pagina-acoes">
            <a class="btn btn-secundario" id="btn-catalogo" target="_blank" rel="noopener"><i data-lucide="external-link"></i>Ver catálogo</a>
          </div>
        </div>

        <div class="abas" role="tablist" aria-label="Situação" id="abas-ped" style="margin-bottom:var(--esp-4)">
          <button type="button" role="tab" class="aba" data-status="novo" aria-selected="true">Novos <span class="aba-contagem" data-cont="novo">0</span></button>
          <button type="button" role="tab" class="aba" data-status="confirmado" aria-selected="false">Confirmados <span class="aba-contagem" data-cont="confirmado">0</span></button>
          <button type="button" role="tab" class="aba" data-status="concluido" aria-selected="false">Viraram venda <span class="aba-contagem" data-cont="concluido">0</span></button>
          <button type="button" role="tab" class="aba" data-status="cancelado" aria-selected="false">Cancelados <span class="aba-contagem" data-cont="cancelado">0</span></button>
        </div>

        <section id="lista-pedidos" class="pedidos-lista" aria-live="polite"></section>
      </main>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <!-- Firebase (login e banco de dados na nuvem) -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/cloudinary-config.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/pedidos.js"></script>
</body>
</html>
