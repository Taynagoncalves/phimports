<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../img/favicon.png">
  <link rel="manifest" href="app.webmanifest">
  <link rel="apple-touch-icon" href="../img/app-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PH Imports">
  <meta name="theme-color" content="#18181B">
  <title>Pedidos online</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Tema claro/escuro antes de desenhar a página (evita piscar) -->
  <script>try{var t=localStorage.getItem("gestaoloja:tema");document.documentElement.dataset.tema=t||(matchMedia("(prefers-color-scheme: dark)").matches?"escuro":"claro");}catch(e){}try{if(localStorage.getItem("gestaoloja:menu")==="recolhido")document.documentElement.classList.add("menu-recolhido");}catch(e){}try{var c=localStorage.getItem("gestaoloja:corcss");if(c){var s=document.createElement("style");s.id="cor-marca";s.textContent=c;document.head.appendChild(s);}}catch(e){}</script>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">
</head>
<body data-pagina="pedidos" data-titulo="Pedidos online">
  <a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>

      <main class="conteudo pd-pagina" id="conteudo" tabindex="-1">
        <div class="pagina-cabecalho">
          <div>
            <h1>Pedidos online</h1>
            <p>Pedidos feitos no catálogo. As peças ficam reservadas até virar venda ou ser cancelado.</p>
          </div>
          <div class="pagina-acoes">
            <button type="button" class="btn btn-secundario pd-som" id="btn-som" aria-pressed="true"></button>
            <a class="btn btn-secundario" id="btn-catalogo" target="_blank" rel="noopener"><i data-lucide="external-link"></i>Ver catálogo</a>
          </div>
        </div>

        <div class="pd-resumo" id="pd-resumo" aria-live="polite"></div>

        <div class="pd-layout" id="pd-layout">
          <section class="pd-coluna" aria-label="Lista de pedidos">
            <div class="pd-barra">
              <label class="pd-busca">
                <i data-lucide="search"></i>
                <input class="input" type="search" id="pd-busca" placeholder="Cliente, telefone, peça ou #código" aria-label="Buscar pedidos">
              </label>
              <select class="select pd-ordem" id="pd-ordem" aria-label="Ordem">
                <option value="auto">Mais antigos primeiro (em aberto)</option>
                <option value="recentes">Mais recentes primeiro</option>
                <option value="antigos">Mais antigos primeiro</option>
              </select>
            </div>
            <div class="pd-filtros" id="pd-filtros" role="tablist" aria-label="Situação"></div>
            <div class="pd-contagem" id="pd-contagem"></div>
            <div class="pd-lista" id="pd-lista" aria-live="polite"></div>
          </section>
          <section class="pd-detalhe" id="pd-detalhe" aria-live="polite"></section>
        </div>
      </main>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <!-- Firebase (login e banco de dados na nuvem) -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/cloudinary-config.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/pedidos.js"></script>
</body>
</html>
