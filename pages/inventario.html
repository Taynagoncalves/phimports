<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventário</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Tema claro/escuro antes de desenhar a página (evita piscar) -->
  <script>try{var t=localStorage.getItem("gestaoloja:tema");document.documentElement.dataset.tema=t||(matchMedia("(prefers-color-scheme: dark)").matches?"escuro":"claro");}catch(e){}try{if(localStorage.getItem("gestaoloja:menu")==="recolhido")document.documentElement.classList.add("menu-recolhido");}catch(e){}try{var c=localStorage.getItem("gestaoloja:corcss");if(c){var s=document.createElement("style");s.id="cor-marca";s.textContent=c;document.head.appendChild(s);}}catch(e){}</script>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">
  <style>
    .leitura { border: 2px solid var(--cor-destaque); }
    .leitura input { height: 60px; font-size: var(--fs-lg); padding-left: 52px; }
    .ultima-leitura { transition: background 400ms ease; }
    .ultima-leitura.piscar { background: var(--cor-sucesso-suave); }
    .ultima-leitura.erro { background: var(--cor-perigo-suave); }
  </style>
</head>
<body data-pagina="inventario" data-titulo="Inventário">
  <a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>

      <main class="conteudo" id="conteudo" tabindex="-1">
        <div class="pagina-cabecalho">
          <div>
            <h1>Inventário</h1>
            <p id="subtitulo">Conte as peças com o leitor de código de barras e ajuste o estoque de uma vez.</p>
          </div>
          <div class="pagina-acoes" id="acoes"></div>
        </div>

        <div id="area"></div>

        <section class="card secao">
          <div class="card-cabecalho"><h2>Inventários finalizados</h2></div>
          <div class="tabela-wrap">
            <table class="tabela tabela-responsiva">
              <thead><tr><th>Nº</th><th>Escopo</th><th>Período</th><th>Responsável</th><th class="num">Contadas</th><th class="num">Sobras</th><th class="num">Faltas</th><th class="num">Diferença (custo)</th></tr></thead>
              <tbody id="historico"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <!-- Firebase (login e banco de dados na nuvem) -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/cloudinary-config.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/inventario.js"></script>
</body>
</html>
