<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../img/favicon.png">
  <link rel="apple-touch-icon" href="../img/icone-app.png">
  <meta name="theme-color" content="#18181B">
  <title>Produtos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Tema claro/escuro antes de desenhar a página (evita piscar) -->
  <script>try{var t=localStorage.getItem("gestaoloja:tema");document.documentElement.dataset.tema=t||(matchMedia("(prefers-color-scheme: dark)").matches?"escuro":"claro");}catch(e){}try{if(localStorage.getItem("gestaoloja:menu")==="recolhido")document.documentElement.classList.add("menu-recolhido");}catch(e){}try{var c=localStorage.getItem("gestaoloja:corcss");if(c){var s=document.createElement("style");s.id="cor-marca";s.textContent=c;document.head.appendChild(s);}}catch(e){}</script>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">
</head>
<body data-pagina="produtos" data-titulo="Produtos">
  <a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>

      <main class="conteudo" id="conteudo" tabindex="-1">
        <div class="pagina-cabecalho">
          <div>
            <h1>Produtos</h1>
            <p id="contador">Carregando…</p>
          </div>
          <div class="pagina-acoes">
            <div class="alternar-visao" role="radiogroup" aria-label="Visualização">
              <button type="button" role="radio" data-visao="lista" aria-checked="true" title="Lista"><i data-lucide="list"></i><span>Lista</span></button>
              <button type="button" role="radio" data-visao="cartoes" aria-checked="false" title="Cartões"><i data-lucide="layout-grid"></i><span>Cartões</span></button>
            </div>
            <a href="produto-form.html" class="btn btn-primario" id="btn-novo-produto"><i data-lucide="plus"></i>Novo produto</a>
          </div>
        </div>

        <!-- Aviso quando há produtos sem NCM (impedem a emissão da NFC-e) -->
        <div id="aviso-ncm" class="mb-4"></div>

        <!-- Categorias (abas com contagem) -->
        <div class="abas abas-categorias" role="tablist" aria-label="Categorias" id="abas-categorias"></div>

        <!-- Filtros -->
        <form class="produtos-filtros" id="filtros" role="search">
          <input type="hidden" name="categoria" id="f-categoria">
          <div class="busca">
            <i data-lucide="search"></i>
            <label for="f-busca" class="sr-only">Buscar</label>
            <input class="input" type="search" id="f-busca" name="busca" placeholder="Buscar por nome, marca, SKU ou código de barras">
          </div>
          <label for="f-marca" class="sr-only">Marca</label>
          <select class="select" id="f-marca" name="marca"></select>
          <label for="f-tamanho" class="sr-only">Tamanho</label>
          <select class="select" id="f-tamanho" name="tamanho"></select>
          <label for="f-cor" class="sr-only">Cor</label>
          <select class="select" id="f-cor" name="cor"></select>
          <label for="f-ncm" class="sr-only">Situação do NCM</label>
          <select class="select so-nota" id="f-ncm" name="ncm">
            <option value="">NCM</option>
            <option value="sem">Sem NCM</option>
            <option value="proprio">NCM próprio</option>
            <option value="categoria">NCM da categoria</option>
          </select>
          <label for="f-ordem" class="sr-only">Ordenar</label>
          <select class="select" id="f-ordem" data-fora-do-filtro>
            <option value="nome">Nome (A–Z)</option>
            <option value="preco-menor">Menor preço</option>
            <option value="preco-maior">Maior preço</option>
            <option value="estoque-menor">Menos estoque</option>
            <option value="estoque-maior">Mais estoque</option>
          </select>
        </form>
        <div class="filtros-ativos" id="filtros-ativos"></div>

        <!-- Lista -->
        <section class="card" id="visao-lista">
          <div class="tabela-wrap">
            <table class="tabela tabela-responsiva tabela-produtos">
              <thead>
                <tr>
                  <th>Produto</th>
                  <th>Categoria</th>
                  <th>Tamanhos e cores</th>
                  <th class="so-nota">NCM</th>
                  <th class="num">Preço</th>
                  <th>Estoque</th>
                  <th class="col-acoes"><span class="sr-only">Ações</span></th>
                </tr>
              </thead>
              <tbody id="lista-produtos"></tbody>
            </table>
          </div>
          <div id="paginacao"></div>
        </section>

        <!-- Cartões -->
        <section id="visao-cartoes" hidden>
          <div class="produtos-cartoes" id="cartoes-produtos"></div>
          <div class="card mt-4" id="paginacao-cartoes-card"><div id="paginacao-cartoes"></div></div>
        </section>
      </main>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <!-- Firebase (login e banco de dados na nuvem) -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/cloudinary-config.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/produtos.js"></script>
</body>
</html>
