<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../img/favicon.png">
  <link rel="apple-touch-icon" href="../img/icone-app.png">
  <meta name="theme-color" content="#FFFFFF">
  <title>Catálogo — PH Imports</title>
  <!-- Prévia do link no WhatsApp / Instagram -->
  <meta name="description" content="Veja as peças disponíveis e peça pelo WhatsApp.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Catálogo PH Imports">
  <meta property="og:description" content="Veja as peças disponíveis e peça pelo WhatsApp.">
  <meta property="og:image" content="https://phimports.onrender.com/img/compartilhar.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/catalogo.css">
</head>
<body>
  <header class="cat-topo">
    <img id="cat-logo" class="cat-logo" src="../img/logo-phimports.png" alt="" width="760" height="343">
    <h1 id="cat-nome" class="sr-only">Catálogo</h1>
    <p id="cat-mensagem" class="cat-mensagem" hidden></p>
    <div class="cat-contatos" id="cat-contatos"></div>
  </header>

  <main class="cat-conteudo">
    <div class="cat-busca">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <label for="cat-q" class="sr-only">Buscar</label>
      <input id="cat-q" type="search" placeholder="Buscar peça…" autocomplete="off">
    </div>
    <nav class="cat-categorias" id="cat-categorias" aria-label="Categorias"></nav>
    <p class="cat-contagem" id="cat-contagem" aria-live="polite"></p>
    <section class="cat-grade" id="cat-grade" aria-label="Peças"></section>
    <div class="cat-vazio" id="cat-estado">Carregando catálogo…</div>
  </main>

  <footer class="cat-rodape" id="cat-rodape"></footer>

  <!-- Detalhe da peça -->
  <div class="cat-modal" id="cat-modal" hidden>
    <div class="cat-modal-fundo" data-fechar></div>
    <div class="cat-folha" role="dialog" aria-modal="true" aria-labelledby="det-nome">
      <button type="button" class="cat-fechar" data-fechar aria-label="Fechar">×</button>
      <div class="cat-det-foto" id="det-foto"></div>
      <div class="cat-det-info">
        <div class="cat-det-cat" id="det-cat"></div>
        <h2 id="det-nome"></h2>
        <div class="cat-preco" id="det-preco"></div>
        <div class="cat-escolha" id="det-cores-bloco"><span>Cor</span><div class="cat-opcoes" id="det-cores"></div></div>
        <div class="cat-escolha"><span>Tamanho</span><div class="cat-opcoes" id="det-tamanhos"></div></div>
        <a class="cat-btn-whats" id="det-whats" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.3-.4.8-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.3.8 3.2.7.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.1-1.2l-.5-.3Z"/></svg>
          <span id="det-whats-texto">Pedir pelo WhatsApp</span>
        </a>
      </div>
    </div>
  </div>

  <!-- Firebase só para LER o catálogo público (sem login) -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/catalogo.js"></script>
</body>
</html>
