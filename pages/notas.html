<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../img/favicon.png">
  <link rel="manifest" href="app.webmanifest">
  <link rel="apple-touch-icon" href="../img/app-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PH Imports">
  <meta name="theme-color" content="#18181B">
  <title>Notas fiscais</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Tema claro/escuro antes de desenhar a página (evita piscar) -->
  <script>try{var t=localStorage.getItem("gestaoloja:tema");document.documentElement.dataset.tema=t||(matchMedia("(prefers-color-scheme: dark)").matches?"escuro":"claro");}catch(e){}try{if(localStorage.getItem("gestaoloja:menu")==="recolhido")document.documentElement.classList.add("menu-recolhido");}catch(e){}try{var c=localStorage.getItem("gestaoloja:corcss");if(c){var s=document.createElement("style");s.id="cor-marca";s.textContent=c;document.head.appendChild(s);}}catch(e){}</script>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">
</head>
<body data-pagina="notas" data-titulo="Notas fiscais">
  <a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>

      <main class="conteudo" id="conteudo" tabindex="-1">
        <div class="pagina-cabecalho">
          <div>
            <h1>Notas fiscais</h1>
            <p>NFC-e emitidas pela loja (simulação — sem comunicação com a SEFAZ).</p>
          </div>
          <div class="pagina-acoes">
            <a href="configuracoes.html#fiscal" class="btn btn-secundario"><i data-lucide="landmark"></i>Dados fiscais</a>
          </div>
        </div>

        <!-- Aviso: dados fiscais incompletos ou ambiente de homologação -->
        <div id="aviso-fiscal" class="mb-4"></div>

        <section class="grid-stats" aria-label="Resumo das notas" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))">
          <article class="card stat">
            <div class="stat-topo"><span class="stat-rotulo">Autorizadas</span><span class="stat-icone"><i data-lucide="circle-check"></i></span></div>
            <div class="stat-valor" id="kpi-autorizadas">—</div>
            <div class="stat-detalhe" id="kpi-autorizadas-det">&nbsp;</div>
          </article>
          <article class="card stat stat-alerta">
            <div class="stat-topo"><span class="stat-rotulo">Pendentes</span><span class="stat-icone"><i data-lucide="clock"></i></span></div>
            <div class="stat-valor" id="kpi-pendentes">—</div>
            <div class="stat-detalhe">Aguardando transmissão</div>
          </article>
          <article class="card stat">
            <div class="stat-topo"><span class="stat-rotulo">Canceladas</span><span class="stat-icone"><i data-lucide="circle-x"></i></span></div>
            <div class="stat-valor" id="kpi-canceladas">—</div>
            <div class="stat-detalhe">No período filtrado</div>
          </article>
        </section>

        <form class="filtros secao" id="filtros" role="search" style="--filtros-colunas: 3">
          <div class="busca">
            <i data-lucide="search"></i>
            <label for="f-busca" class="sr-only">Buscar</label>
            <input class="input" type="search" id="f-busca" name="busca" placeholder="Número, cliente ou chave de acesso">
          </div>
          <div class="campo">
            <label for="f-status" class="sr-only">Status</label>
            <select class="select" id="f-status" name="status">
              <option value="">Todos os status</option>
              <option value="autorizada">Autorizada</option>
              <option value="pendente">Pendente</option>
              <option value="cancelada">Cancelada</option>
            </select>
          </div>
          <div class="campo">
            <label for="f-inicio" class="sr-only">Data inicial</label>
            <input class="input" type="date" id="f-inicio" name="dataInicio" title="Data inicial">
          </div>
          <div class="campo">
            <label for="f-fim" class="sr-only">Data final</label>
            <input class="input" type="date" id="f-fim" name="dataFim" title="Data final">
          </div>
        </form>

        <section class="card">
          <div class="tabela-wrap">
            <table class="tabela tabela-responsiva">
              <thead>
                <tr><th>Número</th><th>Data</th><th>Cliente</th><th>Venda</th><th class="num">Valor</th><th>Status</th><th class="col-acoes"><span class="sr-only">Ações</span></th></tr>
              </thead>
              <tbody id="lista"></tbody>
            </table>
          </div>
          <div id="paginacao"></div>
        </section>
      </main>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <!-- Firebase (login e banco de dados na nuvem) -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/cloudinary-config.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/notas.js"></script>
</body>
</html>
