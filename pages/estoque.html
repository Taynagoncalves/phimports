<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../img/favicon.png">
  <link rel="apple-touch-icon" href="../img/icone-app.png">
  <meta name="theme-color" content="#18181B">
  <title>Estoque</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Tema claro/escuro antes de desenhar a página (evita piscar) -->
  <script>try{var t=localStorage.getItem("gestaoloja:tema");document.documentElement.dataset.tema=t||(matchMedia("(prefers-color-scheme: dark)").matches?"escuro":"claro");}catch(e){}try{if(localStorage.getItem("gestaoloja:menu")==="recolhido")document.documentElement.classList.add("menu-recolhido");}catch(e){}try{var c=localStorage.getItem("gestaoloja:corcss");if(c){var s=document.createElement("style");s.id="cor-marca";s.textContent=c;document.head.appendChild(s);}}catch(e){}</script>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">
</head>
<body data-pagina="estoque" data-titulo="Estoque">
  <a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>

      <main class="conteudo" id="conteudo" tabindex="-1">
        <div class="pagina-cabecalho">
          <div>
            <h1>Estoque</h1>
            <p>Peças por tamanho e cor, e histórico de movimentações.</p>
          </div>
          <div class="pagina-acoes">
            <button type="button" class="btn btn-secundario" id="btn-pdf" data-so-dono><i data-lucide="file-down"></i>Exportar PDF</button>
            <button type="button" class="btn btn-secundario" id="btn-ajuste" data-so-dono><i data-lucide="sliders-horizontal"></i>Ajuste</button>
            <button type="button" class="btn btn-secundario" id="btn-entrada" data-so-dono><i data-lucide="plus"></i>Entrada avulsa</button>
            <a href="entrada.html" class="btn btn-primario" data-so-dono><i data-lucide="package-plus"></i>Entrada de nota (lote)</a>
          </div>
        </div>

        <!-- Indicadores -->
        <section class="grid-stats" aria-label="Resumo do estoque">
          <article class="card stat">
            <div class="stat-topo"><span class="stat-rotulo">Peças em estoque</span><span class="stat-icone"><i data-lucide="package"></i></span></div>
            <div class="stat-valor" id="kpi-pecas">—</div>
            <div class="stat-detalhe" id="kpi-pecas-det">&nbsp;</div>
          </article>
          <article class="card stat">
            <div class="stat-topo"><span class="stat-rotulo" id="kpi-valor-rotulo">Valor em estoque (custo)</span><span class="stat-icone"><i data-lucide="wallet"></i></span></div>
            <div class="stat-valor" id="kpi-valor">—</div>
            <div class="stat-detalhe" id="kpi-valor-det">&nbsp;</div>
          </article>
          <article class="card stat">
            <div class="stat-topo"><span class="stat-rotulo">Variações zeradas</span><span class="stat-icone"><i data-lucide="package-x"></i></span></div>
            <div class="stat-valor" id="kpi-zeradas">—</div>
            <div class="stat-detalhe">Tamanho/cor sem peças</div>
          </article>
          <article class="card stat stat-alerta">
            <div class="stat-topo"><span class="stat-rotulo">Estoque baixo</span><span class="stat-icone"><i data-lucide="triangle-alert"></i></span></div>
            <div class="stat-valor" id="kpi-baixo">—</div>
            <div class="stat-detalhe">Produtos abaixo do mínimo</div>
          </article>
        </section>

        <!-- Abas -->
        <div class="abas secao" role="tablist" aria-label="Visões do estoque">
          <button type="button" class="aba" role="tab" id="aba-posicao" aria-controls="painel-posicao" aria-selected="true"><span>Posição atual</span></button>
          <button type="button" class="aba" role="tab" id="aba-movimentacoes" aria-controls="painel-movimentacoes" aria-selected="false" tabindex="-1"><span>Movimentações</span></button>
        </div>

        <!-- ===== Posição atual: produto × tamanho × cor ===== -->
        <section id="painel-posicao" role="tabpanel" aria-labelledby="aba-posicao">
          <form class="posicao-filtros" id="filtros-posicao" role="search">
            <div class="busca">
              <i data-lucide="search"></i>
              <label for="p-busca" class="sr-only">Buscar produto</label>
              <input class="input" type="search" id="p-busca" placeholder="Buscar produto, marca ou SKU">
            </div>
            <label for="p-categoria" class="sr-only">Categoria</label>
            <select class="select" id="p-categoria"></select>
            <label for="p-ordem" class="sr-only">Ordenar</label>
            <select class="select" id="p-ordem">
              <option value="situacao">Críticos primeiro</option>
              <option value="nome">Nome (A–Z)</option>
              <option value="mais">Mais peças</option>
              <option value="menos">Menos peças</option>
            </select>
          </form>
          <div class="flex items-center justify-between gap-3 mt-4" style="flex-wrap:wrap">
            <div class="chips" role="radiogroup" aria-label="Situação" id="p-situacao">
              <button type="button" class="chip" role="radio" data-situacao="" aria-checked="true">Todos <span class="chip-contagem" id="cont-todos"></span></button>
              <button type="button" class="chip" role="radio" data-situacao="baixo" aria-checked="false"><span class="ponto-status st-alerta"></span>Estoque baixo <span class="chip-contagem" id="cont-baixo"></span></button>
              <button type="button" class="chip" role="radio" data-situacao="furos" aria-checked="false"><span class="ponto-status st-perigo"></span>Com tamanho/cor zerado <span class="chip-contagem" id="cont-furos"></span></button>
              <button type="button" class="chip" role="radio" data-situacao="ok" aria-checked="false"><span class="ponto-status st-sucesso"></span>OK <span class="chip-contagem" id="cont-ok"></span></button>
            </div>
            <button type="button" class="btn btn-fantasma" id="btn-expandir"><i data-lucide="chevrons-up-down"></i><span>Abrir todas as grades</span></button>
          </div>
          <div id="posicao" class="posicao mt-4"></div>
        </section>

        <!-- ===== Movimentações (histórico) ===== -->
        <section id="painel-movimentacoes" role="tabpanel" aria-labelledby="aba-movimentacoes" hidden>
          <!-- Filtros -->
          <form class="filtros" id="filtros" role="search" style="--filtros-colunas: 4">
            <div class="busca">
              <i data-lucide="search"></i>
              <label for="f-busca" class="sr-only">Buscar</label>
              <input class="input" type="search" id="f-busca" name="busca" placeholder="Buscar produto, SKU ou motivo">
            </div>
            <div class="campo">
              <label for="f-tipo" class="sr-only">Tipo</label>
              <select class="select" id="f-tipo" name="tipo">
                <option value="">Todos os tipos</option>
                <option value="entrada">Entrada</option>
                <option value="saida">Saída</option>
                <option value="ajuste">Ajuste</option>
              </select>
            </div>
            <div class="campo">
              <label for="f-produto" class="sr-only">Produto</label>
              <select class="select" id="f-produto" name="produtoId"></select>
            </div>
            <div class="campo">
              <label for="f-inicio" class="sr-only">Data inicial</label>
              <input class="input" type="date" id="f-inicio" name="dataInicio" title="Data inicial">
            </div>
            <div class="campo">
              <label for="f-fim" class="sr-only">Data final</label>
              <input class="input" type="date" id="f-fim" name="dataFim" title="Data final">
            </div>
          </form>

          <!-- Histórico -->
          <section class="card">
            <div class="card-cabecalho">
              <h2>Movimentações</h2>
              <span class="texto-sm texto-3" id="contador"></span>
            </div>
            <div class="tabela-wrap">
              <table class="tabela tabela-responsiva">
                <thead>
                  <tr><th>Produto</th><th>Data</th><th>Tipo</th><th class="num">Qtd.</th><th>Motivo</th><th>Usuário</th></tr>
                </thead>
                <tbody id="lista"></tbody>
              </table>
            </div>
            <div id="paginacao"></div>
          </section>
        </section>
      </main>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <!-- Firebase (login e banco de dados na nuvem) -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/cloudinary-config.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <!-- Geração de PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script src="../js/pdf.js"></script>
  <script src="../js/estoque.js"></script>
</body>
</html>
