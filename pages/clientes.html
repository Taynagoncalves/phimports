<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../img/favicon.png">
  <link rel="manifest" href="app.webmanifest">
  <link rel="apple-touch-icon" href="../img/app-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PH Imports">
  <meta name="theme-color" content="#18181B">
  <title>Clientes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Tema claro/escuro antes de desenhar a página (evita piscar) -->
  <script>try{var t=localStorage.getItem("gestaoloja:tema");document.documentElement.dataset.tema=t||(matchMedia("(prefers-color-scheme: dark)").matches?"escuro":"claro");}catch(e){}try{if(localStorage.getItem("gestaoloja:menu")==="recolhido")document.documentElement.classList.add("menu-recolhido");}catch(e){}try{var c=localStorage.getItem("gestaoloja:corcss");if(c){var s=document.createElement("style");s.id="cor-marca";s.textContent=c;document.head.appendChild(s);}}catch(e){}</script>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">
</head>
<body data-pagina="clientes" data-titulo="Clientes">
  <a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>

      <main class="conteudo" id="conteudo" tabindex="-1">
        <div class="pagina-cabecalho">
          <div>
            <h1>Clientes</h1>
            <p>Quem compra na loja, quanto compra e o que está em aberto · <span id="contador">carregando…</span></p>
          </div>
          <div class="pagina-acoes">
            <button type="button" class="btn btn-primario" id="btn-novo"><i data-lucide="plus"></i>Novo cliente</button>
          </div>
        </div>

        <!-- Indicadores -->
        <section class="grid-stats mb-4" id="indicadores" aria-label="Resumo dos clientes"></section>

        <div class="clientes-filtros" role="search">
          <div class="busca">
            <i data-lucide="search"></i>
            <label for="busca" class="sr-only">Buscar</label>
            <input class="input" type="search" id="busca" placeholder="Buscar por nome, CPF, telefone ou e-mail">
          </div>
          <label for="ordem" class="sr-only">Ordenar</label>
          <select class="select" id="ordem"></select>
        </div>
        <div class="chips mt-4 mb-4" role="radiogroup" aria-label="Grupos de clientes" id="segmentos"></div>

        <section class="card">
          <div class="tabela-wrap">
            <table class="tabela tabela-responsiva">
              <thead id="cabecalho"></thead>
              <tbody id="lista"></tbody>
            </table>
          </div>
          <div id="paginacao"></div>
        </section>
      </main>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <!-- Firebase (login e banco de dados na nuvem) -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/cloudinary-config.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/cadastro.js"></script>
  <script src="../js/clientes.js"></script>
</body>
</html>
