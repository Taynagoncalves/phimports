<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#18181b">
  <title>Catálogo da loja</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .catalogo-wrap{max-width:1100px;margin:auto;padding:24px}.catalogo-topo{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.catalogo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}.catalogo-item{overflow:hidden}.catalogo-foto{width:100%;height:230px;object-fit:cover;background:var(--cor-fundo)}.catalogo-info{padding:16px}.catalogo-busca{max-width:420px;margin-bottom:20px}.catalogo-indisponivel{color:var(--cor-texto-secundario)}
  </style>
</head>
<body>
  <main class="catalogo-wrap">
    <header class="catalogo-topo"><div><h1 id="nome-loja">Catálogo</h1><p id="contato-loja" class="texto-sm"></p></div><button class="btn btn-primario" id="btn-pedido" disabled>Enviar pedido <span id="qtd-pedido">(0)</span></button></header>
    <label class="busca catalogo-busca"><i data-lucide="search"></i><input class="input" id="busca" type="search" placeholder="Buscar produto"></label>
    <div id="estado" class="card card-corpo">Carregando catálogo…</div>
    <section id="produtos" class="catalogo-grid" aria-live="polite"></section>
  </main>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/catalogo.js"></script>
</body>
</html>
