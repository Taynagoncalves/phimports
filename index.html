<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Tema claro/escuro antes de desenhar a página (evita piscar) -->
  <script>try{var t=localStorage.getItem("gestaoloja:tema");document.documentElement.dataset.tema=t||(matchMedia("(prefers-color-scheme: dark)").matches?"escuro":"claro");}catch(e){}try{if(localStorage.getItem("gestaoloja:menu")==="recolhido")document.documentElement.classList.add("menu-recolhido");}catch(e){}try{var c=localStorage.getItem("gestaoloja:corcss");if(c){var s=document.createElement("style");s.id="cor-marca";s.textContent=c;document.head.appendChild(s);}}catch(e){}</script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
</head>
<body data-titulo="Entrar">
  <main class="login-simples">
    <div class="login-caixa">
      <div class="login-marca">
        <img src="img/logo-phimports.png" alt="PH Imports" class="login-logo" width="2172" height="724">
        <p class="login-subtitulo">Sistema de Gestão</p>
      </div>

      <form id="form-login" novalidate>
        <div class="campo">
          <label for="email" class="sr-only">E-mail</label>
          <input class="input" type="email" id="email" name="email" placeholder="E-mail" autocomplete="email" required>
        </div>
        <div class="campo">
          <label for="senha" class="sr-only">Senha</label>
          <input class="input" type="password" id="senha" name="senha" placeholder="Senha" autocomplete="current-password" required>
        </div>
        <label class="checkbox"><input type="checkbox" name="lembrar" id="lembrar" checked> Lembrar de mim</label>
        <button type="submit" class="btn btn-primario btn-grande btn-bloco">Entrar</button>
      </form>

      <!-- Só no modo protótipo (sem Firebase) -->
      <p class="texto-xs texto-centro texto-3 oculto" id="aviso-prototipo">Protótipo: qualquer senha funciona.</p>
    </div>
  </main>

  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <!-- Firebase (login e banco de dados na nuvem) -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/cloudinary-config.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
